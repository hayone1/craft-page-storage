[package]
name = "craft-page-storage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/hayone1/craft-page-storage"
description = "A web page's own file storage (`window.craftStorage`) as a craft-cloud destination for the Craft apps' Open and Save pages"

[dependencies]
# The contract this crate implements: the backend of the shared Open and Save pages
# (`craft_ui::cloud`) and the vendor-neutral types they speak (`craft_cloud`). Pinned to
# storytold/craft-libs#160, where both are proposed; this moves to storytold/craft-libs once
# that lands. An app must use the same craft-libs revision, as for any craft-ui type.
craft-cloud = { git = "https://github.com/wdunn001/craft-libs", rev = "83041887df7b08ca6e8eee8de2dd42edca7e0457" }
craft-ui = { git = "https://github.com/wdunn001/craft-libs", rev = "83041887df7b08ca6e8eee8de2dd42edca7e0457", features = ["cloud"] }
serde_json = "1"

# Already in every Craft web build through eframe's web runner.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# The end-to-end test drives the real Open and Save pages, which need a context and a painter.
egui = { version = "0.37", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The egui the Craft apps build with, as craft-libs patches it. Only this crate's own checks use
# this; an app that depends on the crate brings its own patch.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
